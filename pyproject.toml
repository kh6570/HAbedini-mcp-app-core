# In the name of God, the Most Gracious, the Most Merciful
[project]
name = "mcp-app-core"
version = "0.1.0"
description = "Configurable framework for local MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hossein Abedini", email = "k.h6570@gmail.com" }]
keywords = ["mcp", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.15.12",
    "mypy==1.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_app_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_app_core/py.typed" = "mcp_app_core/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF", "PL", "PTH", "TRY", "S"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "TRY003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"scripts/**" = ["T201"]
"src/mcp_app_core/jobs.py" = ["PLC0415", "PLW0603"]
"src/mcp_app_core/watchdog.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_app_core"]
